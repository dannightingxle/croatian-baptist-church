services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.6-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp-data:/var/www/html
      - ./wp-content/themes/rm-church:/var/www/html/wp-content/themes/rm-church
      - ./wp-content/plugins/rm-church-customizations:/var/www/html/wp-content/plugins/rm-church-customizations
    ports:
      - "${WP_PORT:-8080}:80"

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - wordpress
      - db
    user: "33:33"
    volumes:
      - wp-data:/var/www/html
      - ./wp-content/themes/rm-church:/var/www/html/wp-content/themes/rm-church
      - ./wp-content/plugins/rm-church-customizations:/var/www/html/wp-content/plugins/rm-church-customizations
      - ./scripts:/scripts
      - ./templates:/templates
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    entrypoint: ["wp", "--allow-root"]
    command: ["--info"]

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_USER: ${MYSQL_USER:-wordpress}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    profiles:
      - tools

volumes:
  db-data:
  wp-data:
